[workspace]
resolver = "3"
members = ["filofinder-core", "filofinder-ffi", "uniffi-bindgen"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
